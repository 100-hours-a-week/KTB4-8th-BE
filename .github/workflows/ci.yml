name: Backend CI

# ------------------------------------------------------------
# CI 정책
# ------------------------------------------------------------
# 1) feature/* Push
#    - 개발 중 빠른 피드백을 위해 Test만 수행한다.
#
# 2) main 대상 Pull Request
#    - Gradle Build와 Docker Image Build를 모두 검증한다.
#    - GitHub Branch Protection에서 ci-gate를 Required Check로 설정한다.
#
# 3) main Merge
#    - 최종 main Commit을 다시 검증한다.
#    - 검증된 Docker Image를 Commit SHA Tag로 ECR에 저장한다.
#
# 이 Workflow는 Production EC2에는 배포하지 않는다.
# 실제 Production 배포는 Cloud Repository의 CD Workflow에서 수행한다.
#
# ECR에는 main CI를 통과한 Image만 저장한다.
# latest Tag는 사용하지 않고 Commit SHA를 사용한다.

on:
  push:
    branches:
      - 'feature/**'
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened


# ------------------------------------------------------------
# 기본 GitHub Token 권한
# ------------------------------------------------------------
# AWS 접근이 필요한 main-image Job에서만
# OIDC Token 발급 권한을 별도로 추가한다.

permissions:
  contents: read


jobs:

  # ============================================================
  # 1. Feature Branch CI
  # ============================================================

  feature-check:
    name: Feature - Fast Check

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    # 같은 Feature Branch에 새로운 Commit이 Push되면
    # 이전 Commit의 CI는 더 이상 의미가 없으므로 취소한다.
    concurrency:
      group: backend-feature-${{ github.ref }}
      cancel-in-progress: true

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Gradle Dependency 등을 캐시하여
      # 반복 CI 실행 시 다운로드 시간을 줄인다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x ./gradlew

      # Feature 개발 중에는 빠른 피드백이 목적이다.
      # Docker Image까지 매번 생성하지 않고 Test만 수행한다.
      - name: Run tests
        run: ./gradlew --no-daemon test


  # ============================================================
  # 2. Pull Request CI
  # ============================================================

  pr-gate:
    name: ci-gate

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    # 같은 PR에 새로운 Commit이 Push되면
    # 이전 PR 검증은 취소하고 최신 Commit을 검증한다.
    concurrency:
      group: backend-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:

      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x ./gradlew

      # Gradle build를 통해
      # Test + Application Build + bootJar 생성을 함께 검증한다.
      #
      # 테스트 실패 또는 Application Build 실패 시
      # 이후 Docker Image Build로 넘어가지 않는다.
      - name: Test and application build
        run: ./gradlew --no-daemon build

      # 실제 Backend Dockerfile을 이용해
      # Docker Image가 정상적으로 생성되는지 확인한다.
      #
      # PR에서는 검증만 수행하며 ECR에는 Push하지 않는다.
      - name: Build Docker image
        run: |
          docker build \
            --tag keepgo-backend:pr-${{ github.event.pull_request.number }} \
            .


  # ============================================================
  # 3. Main Branch CI + ECR 등록
  # ============================================================

  main-image:
    name: Main - Build and Push Image

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # GitHub OIDC
    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout main commit
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x ./gradlew

      # PR에서 이미 검증했더라도 main Commit을 다시 검증한다.
      #
      # Merge Commit 또는 Squash Commit으로 인해
      # PR에서 검증했던 SHA와 최종 main SHA가 달라질 수 있기 때문이다.
      #
      # ECR에 저장되는 Image와 동일한 main Commit 기준으로
      # Test / Application Build 성공 여부를 보장한다.
      - name: Test and application build
        run: ./gradlew --no-daemon build

      # GitHub OIDC Token을 이용해
      # ECR Push 권한만 가진 AWS IAM Role을 Assume한다.
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker Image Tag로 Full Commit SHA를 사용한다.
      #
      # Image와 Git Commit의 관계를 명확하게 추적할 수 있고
      # Rollback 시 특정 Commit의 Image를 정확하게 선택할 수 있다.
      - name: Set image reference
        shell: bash
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      # Backend Dockerfile을 이용하여
      # 최종 main Commit 기준 Docker Image를 생성한다.
      #
      # Dockerfile 내부에서는:
      #
      # ./gradlew --no-daemon clean bootJar
      #
      # 를 수행하여 실제 Runtime Image에 들어갈
      # Spring Boot 실행 JAR을 생성한다.
      - name: Build Docker image
        run: docker build --tag "$IMAGE_URI" .

      # CI 검증을 모두 통과한 Image만 ECR에 저장한다.
      - name: Push image to ECR
        run: docker push "$IMAGE_URI"

      - name: Show published image
        run: |
          echo "Published backend image: $IMAGE_URI"
          echo "Commit SHA: $GITHUB_SHA"