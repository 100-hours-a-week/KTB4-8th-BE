name: Backend CI

# ------------------------------------------------------------
# CI 정책
# ------------------------------------------------------------
# main / develop Push
# - Gradle Build와 Docker Image Build를 검증한다.
# - 검증된 Docker Image를 Commit SHA Tag로 ECR에 저장한다.
#
# 이 Workflow는 Production EC2에는 배포하지 않는다.
# 실제 Production 배포는 Cloud Repository의 CD Workflow에서 수행한다.
#
# ECR에는 각 브랜치 CI를 통과한 Image를 저장한다. Cloud가 운영/V2 개발 대상을 구분한다.
# latest Tag는 사용하지 않고 Commit SHA를 사용한다.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # 의존 PR의 base 변경과 Draft 해제 뒤에도 검증한다.
    types: [opened, synchronize, reopened, edited, ready_for_review]

# main에 새로운 Commit이 Push되면 이전 Commit의 CI를 취소하고
# 최신 Commit만 검증 및 발행한다.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------
# 기본 GitHub Token 권한
# ------------------------------------------------------------
# AWS 접근이 필요한 main-image Job에서만
# OIDC Token 발급 권한을 별도로 추가한다.

permissions:
  contents: read


jobs:

  mysql-migrations:
    name: MySQL migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST_SERVER_URL: jdbc:mysql://127.0.0.1:3306/
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: integration-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Flyway baseline and migrations on MySQL
        run: bash gradlew --no-daemon mysqlIntegrationTest
      - name: Upload MySQL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-migration-test-reports
          path: build/reports/tests/mysqlIntegrationTest

  main-image:
    name: ${{ github.ref == 'refs/heads/develop' && 'Dev - Build and Push Image' || 'Main - Build and Push Image' }}

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    needs: mysql-migrations

    runs-on: ubuntu-latest

    # GitHub OIDC
    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout main commit
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x ./gradlew

      # MySQL migration 검사가 통과한 같은 Commit만 Image로 발행한다.
      - name: Application build
        run: ./gradlew --no-daemon bootJar

      # GitHub OIDC Token을 이용해
      # ECR Push 권한만 가진 AWS IAM Role을 Assume한다.
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker Image Tag로 Full Commit SHA를 사용한다.
      #
      # Image와 Git Commit의 관계를 명확하게 추적할 수 있고
      # Rollback 시 특정 Commit의 Image를 정확하게 선택할 수 있다.
      - name: Set image reference
        shell: bash
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      # Backend Dockerfile을 이용하여
      # 최종 main Commit 기준 Docker Image를 생성한다.
      #
      # Dockerfile 내부에서는:
      #
      # ./gradlew --no-daemon clean bootJar
      #
      # 를 수행하여 실제 Runtime Image에 들어갈
      # Spring Boot 실행 JAR을 생성한다.
      - name: Build Docker image
        run: docker build --tag "$IMAGE_URI" .

      # CI 검증을 모두 통과한 Image만 ECR에 저장한다.
      - name: Push image to ECR
        run: docker push "$IMAGE_URI"

      - name: Show published image
        run: |
          echo "Published backend image: $IMAGE_URI"
          echo "Commit SHA: $GITHUB_SHA"
