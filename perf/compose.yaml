name: keepgo-loop313
services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_ROOT_PASSWORD: perf-only
    ports:
      - "127.0.0.1:13316:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -uroot --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
  k6:
    image: grafana/k6:2.3.0
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ../:/work
    extra_hosts:
      - "host.docker.internal:host-gateway"
