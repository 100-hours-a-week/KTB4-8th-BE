<!doctype html><html lang="ko"><meta charset="utf-8"><title>가상 스레드 판단 카드</title><link rel="stylesheet" href="../assets/teaching.css"><main><h1>가상 스레드 판단 카드</h1><p>실행 대기열: 실행할 스레드를 아직 배정받지 못한 작업. I/O 대기: 실행 중 외부 응답을 기다리는 시간. 처리량: 단위 시간에 완료한 작업 수.</p><p>외부 API 자체가 느린 것과, 기다리는 작업 때문에 실행 슬롯이 부족한 것은 다른 문제다. 가상 스레드는 후자에서 검토할 수 있다.</p><p>CPU 포화, DB 연결 부족, 외부 API 한도도 따로 측정한다. 실행 수를 늘리면 이 자원이 먼저 포화될 수 있다.</p><p><a href="https://docs.oracle.com/en/java/javase/24/core/virtual-threads.html">Oracle 공식 설명</a> · <a href="../lessons/0001-find-the-wait.html">첫 수업</a></p></main></html>
