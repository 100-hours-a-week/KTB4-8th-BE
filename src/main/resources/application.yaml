spring:
  sql:
    init:
      schema-locations:
        - classpath:org/springframework/security/oauth2/client/oauth2-client-schema.sql
  application:
    name: keepgo
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:${DB_VENDOR:mysql}://${DB_HOST:172.25.96.1}:${DB_PORT:3306}/${DB_NAME:keepgo}?serverTimezone=${DB_TIMEZONE:Asia/Seoul}
    username: ${DB_USERNAME:keepgo}
    password: ${DB_PASSWORD:0000}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    database-platform: org.hibernate.dialect.${DB_DIALECT:MySQL}Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:451367164829-umjho06iuhcmapqlk7f0ebesllrbsukq.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - openid
              - profile
              - email

keepgo:
  security:
    redirection-address: ${FRONTEND_SERVER_ADDRESS:http://localhost:3000}
    jwt:
      access-token-ttl: 30m
      key-id: placeholder
      issuer: https://auth.example.com
      audience: placeholder
      client-id: placeholder
      public-key: classpath:keys/public_key.pem
      private-key: classpath:keys/private_key.pem
  clients:
    google:
      address: ${GOOGLE_API_ADDRESS:https://www.googleapis.com}
    geocoding:
      address: ${VWORLD_API_ADDRESS:https://api.vworld.kr}
      key: ${VWORLD_API_KEY}
    ai:
      address: ${AI_SERVER_API_ADDRESS:placeholder}
  cache:
    rt-hash:
      maximum-size: 1000
      expire-after-write: 1d

management:
  server:
    # Actuator는 관리 포트로만 노출한다. (모니터링 보안 그룹에만 개방)
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # 자동 대량 bucket 대신 메트릭 계약 v1의 HTTP 경계만 사용한다.
      percentiles-histogram:
        http.server.requests: false
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s,60s,120s,300s

logging:
  level:
    root: ${LOGGING_LEVEL:TRACE}